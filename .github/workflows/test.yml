name: test
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.RCS_SOURCE_TOKEN }}
      - run: npm test
      - run: npm run pack
